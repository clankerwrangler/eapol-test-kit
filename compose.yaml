name: eapol-test-kit

services:
  kit:
    image: eapol-test-kit:local
    build: .
    init: true
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "${EAPOLKIT_BIND_ADDRESS:-127.0.0.1}:${EAPOLKIT_PORT:-8080}:8080"
    environment:
      EAPOLKIT_DATA_DIR: /data
      EAPOLKIT_BIND_ADDRESS: "${EAPOLKIT_BIND_ADDRESS:-127.0.0.1}"
      EAPOLKIT_ALLOWED_HOSTS: "${EAPOLKIT_ALLOWED_HOSTS:-}"
      EAPOLKIT_SECURE_COOKIES: "${EAPOLKIT_SECURE_COOKIES:-0}"
    volumes:
      - kit-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    ulimits:
      core:
        soft: 0
        hard: 0
    mem_limit: 512m
    cpus: 1.0
    labels:
      org.eapolkit.project: eapol-test-kit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/session', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  kit-data:
    labels:
      org.eapolkit.project: eapol-test-kit
